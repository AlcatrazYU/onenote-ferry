# Builds the plugin on GitHub and publishes it, so that anyone can check that the files of a
# release were built from this repository (GitHub's build provenance attestations).
#
# Pushing a tag named like the version in manifest.json (for example 1.0.1) checks, tests and
# builds the plugin, attests main.js, manifest.json and styles.css, and publishes the release with
# RELEASE_NOTES.md as its text. Run by hand (Actions > Release > Run workflow), it only checks,
# tests and builds.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag is the version in manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but manifest.json says $version."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:samples
      - run: npm run build:plugin

      - name: Attest the release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/plugin/main.js
            manifest.json
            styles.css

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/plugin/main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
