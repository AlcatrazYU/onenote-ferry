[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
description = "OneNote Ferry's bridge to the OneNote parser: section JSON and attachments, natively and as WebAssembly"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dump"
path = "src/bin/dump.rs"

[dependencies]
parser = { path = "../parser" }
parser-utils = { path = "../parser-utils" }
serde_json = "1"
sha1_smol = { version = "1", features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"

[package.metadata.wasm-pack.profile.release]
# Size optimisation (binaryen) is decided when release packaging is set up.
wasm-opt = false
